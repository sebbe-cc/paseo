# Fork (sebbe-cc/paseo) desktop builds; scripts/build-fork-desktop-mac.sh runs this.
# Signs with the Apple Development identity via sign-fork.js, skips notarization and updates from the fork.
extends: ./electron-builder.yml
# The version is 0.9.2-desvio.<n>; keep publishing latest-mac.yml, not desvio-mac.yml.
detectUpdateChannel: false
publish:
  provider: github
  owner: sebbe-cc
  repo: paseo
  releaseType: release
mac:
  notarize: false
  sign: ./scripts/sign-fork.js
